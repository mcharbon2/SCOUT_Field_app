<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SCOUT">
  <defs>
    <radialGradient id="bgm" cx="50%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#16213a"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </radialGradient>
    <linearGradient id="ringm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6BC5FF"/>
      <stop offset="100%" stop-color="#2E90FA"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background: the launcher applies its own mask -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgm)"/>

  <!-- everything kept within the central safe zone (r < ~150 of center) -->
  <g fill="none" stroke="url(#ringm)" stroke-width="15" stroke-linecap="round">
    <circle cx="256" cy="238" r="132" opacity="0.30"/>
    <circle cx="256" cy="238" r="88"/>
    <circle cx="256" cy="238" r="46" opacity="0.65"/>
  </g>
  <path d="M256 238 L348 146" stroke="#4FB0FF" stroke-width="17" stroke-linecap="round"/>
  <circle cx="256" cy="238" r="16" fill="#4FB0FF"/>

  <text x="256" y="352" text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', 'Courier New', monospace"
        font-size="52" font-weight="700" letter-spacing="9" fill="#e8ecf4">SCOUT</text>
</svg>
