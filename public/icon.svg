<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SCOUT Field Tech">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#16213a"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6BC5FF"/>
      <stop offset="100%" stop-color="#2E90FA"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#2d3a52" stroke-width="4"/>

  <!-- radar mark, centered a touch high to leave room for the wordmark -->
  <g fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round">
    <circle cx="256" cy="206" r="118" opacity="0.30"/>
    <circle cx="256" cy="206" r="78"/>
    <circle cx="256" cy="206" r="40" opacity="0.65"/>
  </g>
  <path d="M256 206 L338 124" stroke="#4FB0FF" stroke-width="15" stroke-linecap="round"/>
  <circle cx="256" cy="206" r="14" fill="#4FB0FF"/>

  <!-- wordmark -->
  <text x="256" y="404" text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', 'Courier New', monospace"
        font-size="62" font-weight="700" letter-spacing="10" fill="#e8ecf4">SCOUT</text>
  <text x="256" y="446" text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', 'Courier New', monospace"
        font-size="22" font-weight="400" letter-spacing="6" fill="#5a6478">FIELD TECH</text>
</svg>
